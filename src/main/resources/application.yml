server:
  port: ${PORT:8082}
  forward-headers-strategy: framework

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:saneamiento_ambiental}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    docExpansion: none
    defaultModelsExpandDepth: -1
    displayRequestDuration: true
    filter: true
    deepLinking: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:EconexusSecretKey2026MuySeguraParaDesarrollo}
    expiration-ms: 86400000  # 24 horas
